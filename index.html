<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6b7f73">
<title>北大数学</title>
<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(','\\)']],

<style>
:root{
  --accent:#6b7f73;
  --accent-dark:#52665b;
  --accent-soft:#e9efeb;
  --bg:#f5f6f4;
  --card:#ffffff;
  --text:#202321;
  --muted:#707672;
  --line:#e2e5e2;
  --danger:#b75d5d;
  --danger-soft:#f8eaea;
  --good:#52745e;
  --good-soft:#eaf2ec;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
body{
  font-family:"Ryumin Pro","リュウミン","Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho",serif;
  -webkit-font-smoothing:antialiased;
}
button{
  font-family:"FutoGoB101 Pro","太ゴ","Hiragino Kaku Gothic ProN","Hiragino Kaku Gothic Pro","Yu Gothic",sans-serif;
}
h1,h2,h3,.nav-label,.tag,.meta,.btn,.small-title,.section-title,
.unit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.unit-choice{border:1px solid var(--line);background:white;border-radius:15px;padding:14px 12px;text-align:left;font-family:inherit;font-size:15px;cursor:pointer}
.unit-choice.selected{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-dark);font-weight:700}
@media(max-width:420px){.unit-grid{grid-template-columns:1fr}}
.status{
  font-family:"FutoGoB101 Pro","太ゴ","Hiragino Kaku Gothic ProN","Hiragino Kaku Gothic Pro","Yu Gothic",sans-serif;
}
#app{min-height:100vh}
main{max-width:780px;margin:auto;padding:22px 17px 112px}
.screen{display:none;min-height:calc(100vh - 140px)}
.screen.active{display:block}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:24px;
  padding:24px 21px;
  box-shadow:0 5px 22px rgba(40,50,44,.06);
}
.hero{
  padding:30px 23px;
  border-top:5px solid var(--accent);
}
h1{font-size:31px;line-height:1.28;margin:8px 0 12px;letter-spacing:.01em}
h2{font-size:24px;line-height:1.45;margin:10px 0 18px}
h3{font-size:19px;margin:0 0 10px}
p{font-size:16px;line-height:1.95;margin:10px 0}
.small{color:var(--muted);font-size:13px;line-height:1.7}
.small-title{font-size:13px;color:var(--accent-dark);letter-spacing:.06em}
.meta{margin:0 0 12px}
.tag{
 display:inline-block;background:var(--accent-soft);color:var(--accent-dark);
 padding:6px 10px;border-radius:999px;margin:3px 4px 3px 0;font-size:12px
}
.btn{
 width:100%;border:0;border-radius:15px;padding:15px 16px;margin-top:12px;
 font-size:16px;font-weight:700;cursor:pointer;transition:.15s;
}
.btn.primary{background:var(--accent);color:white}
.btn.primary:active{background:var(--accent-dark)}
.btn.secondary{background:#eef0ee;color:var(--text)}
.btn.good{background:var(--good-soft);color:var(--good);border:1px solid #d7e5da}
.btn.bad{background:var(--danger-soft);color:var(--danger);border:1px solid #eed5d5}
.btn.review{background:#eef1f6;color:#4e6077;border:1px solid #dbe1ea}
.btn.small-btn{padding:12px 10px;font-size:14px}
.topbar{margin-bottom:12px}
.back{
 border:0;background:transparent;color:var(--muted);padding:5px 0;margin:0;
 font-family:inherit;font-size:14px;cursor:pointer
}
.question-box{margin-top:14px}
.math-content{font-size:16px;line-height:2.05}
.math-content mjx-container{max-width:100%;overflow-x:auto;overflow-y:hidden}
.answer-screen .question-preview{
 background:#f8f9f7;border:1px solid var(--line);border-radius:17px;padding:17px;margin-bottom:17px
}
.answer-screen .question-preview .small-title{margin-bottom:8px}
.solution{
 font-size:16px;line-height:2.05;
}
.solution h3{font-size:18px;line-height:1.5;margin-top:26px;padding-top:4px;
 margin-top:23px;padding-left:11px;border-left:4px solid var(--accent)
}
.solution mjx-container{max-width:100%;overflow-x:auto;overflow-y:hidden}
.action-label{
 text-align:center;color:var(--muted);font-size:13px;margin:5px 0 0
}
.rating-row{margin-top:16px}
.rating-row .btn:first-child{margin-top:0}
.review-list{display:flex;flex-direction:column;gap:10px;margin-top:15px}
.review-item{
 width:100%;text-align:left;background:white;border:1px solid var(--line);
 border-radius:17px;padding:16px;cursor:pointer;color:var(--text);
 font-family:inherit
}
.review-item:active{background:#f1f4f1}
.review-no{font-family:"FutoGoB101 Pro","太ゴ","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-weight:700;color:var(--accent-dark);font-size:13px}
.review-title{font-size:17px;font-weight:700;margin:5px 0 7px}
.review-meta{font-size:12px;color:var(--muted);margin-bottom:7px}
.review-summary{font-size:14px;line-height:1.65}
.empty{
 text-align:center;padding:48px 20px;color:var(--muted);background:white;border:1px dashed #ccd1cc;border-radius:20px
}
.status{
 padding:9px 11px;border-radius:12px;font-size:13px;margin-top:10px;background:var(--accent-soft);color:var(--accent-dark)
}
.hint{
 display:none;background:#f4f7f4;border-left:4px solid var(--accent);
 border-radius:12px;padding:15px 16px;margin-top:14px;font-size:15px;line-height:1.9
}
.hint.show{display:block}
.bottom-nav{
 position:fixed;z-index:20;left:0;right:0;bottom:0;
 padding:8px 12px calc(8px + env(safe-area-inset-bottom));
 background:rgba(255,255,255,.94);backdrop-filter:blur(16px);
 border-top:1px solid var(--line);
 display:flex;justify-content:center;gap:8px
}
.nav-btn{
 width:min(46vw,230px);border:0;background:transparent;color:#757b77;
 border-radius:18px;padding:9px 8px 8px;cursor:pointer
}
.nav-btn.active{background:var(--accent-soft);color:var(--accent-dark)}
.nav-icon{display:flex;justify-content:center;align-items:center;height:24px;margin-bottom:2px}.bookmark-icon svg{display:block}
.nav-label{display:block;font-size:12px;font-weight:700}
.toast{
 position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
 background:#222;color:white;padding:10px 15px;border-radius:12px;font-size:13px;
 opacity:0;pointer-events:none;transition:.2s;z-index:50
}
.toast.show{opacity:1}
@media(min-width:700px){
 main{padding-left:24px;padding-right:24px}
 .bottom-nav{left:50%;right:auto;transform:translateX(-50%);width:520px;border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0}
}
</style>
</head>
<body>
<div id="app">
<main>

<section id="home" class="screen active">
  <div class="card hero">
    <div class="small-title">北海道大学・理系数学</div>
    <h1>北大数学<br>演習</h1>
    <p>北大らしい「2単元融合」を意識したオリジナル問題を、1題ずつじっくり解こう。</p>
    <button class="btn primary" onclick="startRandom()">ランダムに問題を出す</button><button class="btn secondary" onclick="showUnitSelect()">📚 単元を選ぶ</button>
    <div class="status" id="homeStatus"></div>
  </div>
</section>


<section id="units" class="screen">
  <div class="topbar"><button class="back" onclick="goHome()">‹ ホーム</button></div>
  <div class="card">
    <div class="small-title">単元を選ぶ</div>
    <h2>やりたい単元を選択</h2>
    <p class="small">1つまたは2つまで選べます。選んだ単元の問題からランダムに出題します。</p>
    <div id="unitChoices" class="unit-grid"></div>
    <div id="unitStatus" class="status">0 / 2 単元を選択中</div>
    <button class="btn primary" onclick="startSelectedUnits()">この単元で問題を出す</button>
  </div>
</section>

<section id="problem" class="screen">
  <div class="topbar"><button class="back" onclick="goHome()">‹ ホーム</button></div>
  <div class="card">
    <div id="problemMeta" class="meta"></div>
    <h2 id="problemTitle"></h2>
    <div id="problemQuestion" class="math-content question-box"></div>
    <button class="btn secondary" onclick="toggleHint()">ヒントを見る</button>
    <div id="hintBox" class="hint"></div>
    <button class="btn primary" onclick="showAnswer()">解答・解説を見る</button>
  </div>
</section>

<section id="answer" class="screen answer-screen">
  <div class="topbar"><button class="back" onclick="backToProblem()">‹ 問題に戻る</button></div>
  <div class="card">
    <div class="question-preview">
      <div class="small-title">問題</div>
      <div id="answerQuestion" class="math-content"></div>
    </div>

    <div class="small-title">解答・解説</div>
    <div id="solution" class="solution"></div>

    <div class="rating-row">
      <div class="small-title">今回の結果</div>
      <button class="btn good" onclick="markCorrect()">正解</button>
      <button class="btn bad" onclick="markWrong()">不正解</button>
      <button class="btn review" onclick="addReview()">復習</button>
      <div id="resultStatus"></div>
    </div>

    <button class="btn secondary" onclick="startRandom()">別の問題を出す</button>
  </div>
</section>

<section id="review" class="screen">
  <div class="card">
    <div class="small-title">復習</div>
    <h2>復習する問題</h2>
    <p class="small">不正解にした問題、または「復習」を押した問題がここに残ります。</p>
    <div id="reviewList" class="review-list"></div>
  </div>
</section>

</main>

<nav class="bottom-nav" aria-label="メインナビゲーション">
  <button id="navHome" class="nav-btn active" onclick="goHome()">
    <span class="nav-icon">⌂</span><span class="nav-label">ホーム</span>
  </button>
  <button id="navReview" class="nav-btn" onclick="showReview()">
    <span class="nav-icon bookmark-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 4.5A2.5 2.5 0 0 1 9 2h6a2.5 2.5 0 0 1 2.5 2.5V21l-5.5-3.4L6.5 21V4.5Z"/></svg></span><span class="nav-label">復習</span>
  </button>
</nav>

<div id="toast" class="toast"></div>
</div>

<script>
const problems = [{"id": 1, "title": "点の移動と数列", "units": ["ベクトル", "数列"], "difficulty": "北大標準", "time": 22, "summary": "点を漸化式で動かし、座標と移動距離の無限和を求める問題。", "question": "\n平面上に \\(O=(0,0),\\ A=(2,0),\\ B=(0,2)\\) をとる。点 \\(P_n\\) を\n\\(P_1=A\\) とし、\\(n=1,2,3,\\ldots\\) に対して\n\\[\n\\overrightarrow{OP_{n+1}}\n=\\frac12\\overrightarrow{OP_n}\n+\\frac12\\overrightarrow{OB}\n\\]\nで定める。\n\n(1) \\(P_n\\) の座標を求めよ。\n\n(2) \\(P_n\\) の \\(x\\) 軸からの距離が最も大きくなることはあるか。あるならその \\(n\\) を求めよ。\n\n(3) 線分 \\(P_nP_{n+1}\\) の長さを \\(d_n\\) とするとき、\n\\[\n\\sum_{n=1}^{\\infty}d_n\n\\]\nを求めよ。\n", "hint": "(1) 座標を \\(P_n=(x_n,y_n)\\) とおき、\\(x_n,y_n\\) それぞれの漸化式を立てる。", "solution": "\n### (1) \\(P_n\\) の座標\n\n\\(P_n=(x_n,y_n)\\) とおくと、定義より\n\\[\n(x_{n+1},y_{n+1})\n=\\frac12(x_n,y_n)+\\frac12(0,2).\n\\]\nしたがって\n\\[\nx_{n+1}=\\frac12x_n,\\qquad\ny_{n+1}=\\frac12y_n+1.\n\\]\n\nまず \\(x_1=2\\) なので、\n\\[\nx_n=2\\left(\\frac12\\right)^{n-1}=2^{1-n}.\n\\]\n\n次に \\(y_1=0\\) である。\\(y_n\\) は\n\\[\ny_{n+1}-2=\\frac12(y_n-2)\n\\]\nと変形できるので、\n\\[\ny_n-2=(y_1-2)\\left(\\frac12\\right)^{n-1}\n=-2\\left(\\frac12\\right)^{n-1}.\n\\]\nよって\n\\[\ny_n=2-2^{1-n}.\n\\]\n\nしたがって\n\\[\n\\boxed{P_n=\\left(2^{1-n},\\,2-2^{1-n}\\right)}.\n\\]\n\n### (2) \\(x\\) 軸から最も遠い点\n\n\\(P_n\\) は \\(y>0\\) にあるので、\\(x\\) 軸からの距離は \\(y_n\\) そのもの。\n\n\\[\ny_n=2-2^{1-n}.\n\\]\n\n\\(n\\) が大きくなると \\(2^{1-n}\\) は小さくなるため、\\(y_n\\) は単調増加します。\n\nしかし、\n\\[\ny_n<2\n\\]\nであり、どの有限の \\(n\\) に対しても \\(y_n=2\\) にはなりません。\n\nしたがって、有限の \\(n\\) で「最も遠い」という点は存在しません。\n\n\\[\n\\boxed{\\text{最大値をとる }n\\text{ は存在しない}}\n\\]\n\n### (3) \\(\\sum d_n\\)\n\n\\[\n\\overrightarrow{P_nP_{n+1}}\n=P_{n+1}-P_n\n=\\left(-2^{-n},\\,2^{-n}\\right).\n\\]\n\nしたがって\n\\[\nd_n\n=\\sqrt{(-2^{-n})^2+(2^{-n})^2}\n=\\sqrt2\\,2^{-n}.\n\\]\n\nよって\n\\[\n\\sum_{n=1}^{\\infty}d_n\n=\\sqrt2\\sum_{n=1}^{\\infty}\\left(\\frac12\\right)^n.\n\\]\n\n等比級数の和より\n\\[\n\\sum_{n=1}^{\\infty}\\left(\\frac12\\right)^n=1.\n\\]\n\nしたがって\n\\[\n\\boxed{\\sum_{n=1}^{\\infty}d_n=\\sqrt2}.\n\\]\n"}, {"id": 2, "title": "面積と数列", "units": ["積分", "数列"], "difficulty": "北大標準", "time": 24, "summary": "放物線と直線で囲まれる面積を数列に組み込み、無限級数を考える問題。", "question": "\n\\(a>0\\) とし、曲線 \\(y=x^2\\) と直線 \\(y=ax\\) で囲まれる部分の面積を \\(S(a)\\) とする。\n\n(1) \\(S(a)\\) を \\(a\\) の式で表せ。\n\n(2) \\(a_1=1,\\quad a_{n+1}=\\frac32a_n\\) と定めるとき、\\(S(a_n)\\) を求めよ。\n\n(3)\n\\[\n\\sum_{n=1}^{\\infty}\\frac1{S(a_n)}\n\\]\nの収束・発散を判定し、収束するならその和を求めよ。\n", "hint": "(1) まず \\(x^2=ax\\) から2曲線の交点を求める。 (3) \\(S(a_n)\\) を等比数列の形に直す。", "solution": "\n### (1) \\(S(a)\\)\n\n交点は\n\\[\nx^2=ax\n\\]\nより\n\\[\nx(x-a)=0.\n\\]\nしたがって \\(x=0,a\\)。\n\n\\(0\\le x\\le a\\) では直線 \\(y=ax\\) が放物線 \\(y=x^2\\) より上にあるので、\n\\[\nS(a)=\\int_0^a(ax-x^2)\\,dx.\n\\]\n\n計算すると\n\\[\nS(a)\n=\\left[\\frac a2x^2-\\frac13x^3\\right]_0^a\n=\\frac{a^3}{2}-\\frac{a^3}{3}\n=\\boxed{\\frac{a^3}{6}}.\n\\]\n\n### (2) \\(S(a_n)\\)\n\n\\[\na_{n+1}=\\frac32a_n,\\qquad a_1=1\n\\]\nだから\n\\[\na_n=\\left(\\frac32\\right)^{n-1}.\n\\]\n\nしたがって\n\\[\nS(a_n)\n=\\frac16\\left(\\frac32\\right)^{3n-3}.\n\\]\n\nつまり\n\\[\n\\boxed{S(a_n)=\\frac16\\left(\\frac{27}{8}\\right)^{n-1}}.\n\\]\n\n### (3) 無限級数\n\n逆数をとると\n\\[\n\\frac1{S(a_n)}\n=6\\left(\\frac8{27}\\right)^{n-1}.\n\\]\n\nこれは初項 \\(6\\)、公比 \\(\\frac8{27}\\) の等比級数。\n\n\\[\n\\left|\\frac8{27}\\right|<1\n\\]\nなので収束する。\n\nその和は\n\\[\n\\frac{6}{1-\\frac8{27}}\n=\\frac{6}{\\frac{19}{27}}\n=\\boxed{\\frac{162}{19}}.\n\\]\n"}, {"id": 3, "title": "条件付き確率と図形", "units": ["確率", "ベクトル"], "difficulty": "北大標準", "time": 25, "summary": "正方形の頂点を選び、ベクトルの内積の値から確率を考える問題。", "question": "\n正方形 \\(ABCD\\) の頂点から異なる2点を一様に、順序を区別して選び、選んだ点を \\(P,Q\\) とする。\n\\(\\overrightarrow{AP}\\) と \\(\\overrightarrow{AQ}\\) の内積を \\(X\\) とする。\n\n(1) \\(X=0\\) となる確率を求めよ。\n\n(2) \\(X<0\\) となる確率を求めよ。\n\n(3) \\(X\\) の期待値を求めよ。\n", "hint": "\\(A=(0,0),B=(1,0),C=(1,1),D=(0,1)\\) とおき、12通りの順序つきの選び方を表にして内積を数える。", "solution": "\n### 準備\n\n正方形を\n\\[\nA=(0,0),\\quad B=(1,0),\\quad C=(1,1),\\quad D=(0,1)\n\\]\nとおく。\n\n異なる2点を順序つきで選ぶので、全体は\n\\[\n4\\cdot3=12\n\\]\n通り。\n\nここで \\(A\\) を選んだ場合、\n\\[\n\\overrightarrow{AA}=\\boldsymbol0\n\\]\nなので、内積 \\(X\\) は必ず \\(0\\) になります。\n\n### (1) \\(X=0\\)\n\n\\(P\\) または \\(Q\\) が \\(A\\) である選び方は\n\\[\n6\n\\]\n通り。\n\nさらに \\(P,Q\\) が \\(B,C,D\\) の中から選ばれる場合、\n\\[\n\\overrightarrow{AB}\\cdot\\overrightarrow{AD}=0\n\\]\nなので \\((B,D),(D,B)\\) の2通りが追加される。\n\nしたがって\n\\[\nP(X=0)=\\frac{6+2}{12}\n=\\boxed{\\frac23}.\n\\]\n\n### (2) \\(X<0\\)\n\n\\(A\\) を含む場合は \\(X=0\\)。\n\n\\(B,C,D\\) に対応するベクトルは\n\\[\n(1,0),\\ (1,1),\\ (0,1).\n\\]\n\nこれらのどの2つの内積も \\(0\\) 以上なので、負になる組はありません。\n\n\\[\n\\boxed{P(X<0)=0}.\n\\]\n\n### (3) 期待値\n\n\\(A\\) を含む6通りは \\(X=0\\)。\n\n残り6通りについて\n\\[\n\\overrightarrow{AB}\\cdot\\overrightarrow{AC}=1,\\quad\n\\overrightarrow{AC}\\cdot\\overrightarrow{AB}=1,\n\\]\n\\[\n\\overrightarrow{BC}\\text{ に相当するものではなく、}\n\\overrightarrow{AB}\\cdot\\overrightarrow{AD}=0,\n\\]\nなどと数えると、内積の合計は\n\\[\n1+1+0+0+1+1=4.\n\\]\n\nしたがって\n\\[\nE(X)=\\frac4{12}\n=\\boxed{\\frac13}.\n\\]\n"}, {"id": 4, "title": "複素数と軌跡", "units": ["複素数平面", "図形と方程式"], "difficulty": "北大標準", "time": 23, "summary": "2つの複素数からの距離が等しい条件と円との交点を考える問題。", "question": "\n複素数 \\(z\\) が\n\\[\n|z-1|=|z-i|\n\\]\nを満たすとする。\n\n(1) \\(z=x+yi\\) とおいて、\\(x,y\\) の満たす方程式を求めよ。\n\n(2) さらに \\(|z|=\\sqrt2\\) を満たす点 \\(z\\) の個数を求めよ。\n\n(3) (2)の点をすべて求めよ。\n", "hint": "(1) 両辺を2乗して絶対値を外す。 (2) (1)の直線と円 \\(x^2+y^2=2\\) の共有点を考える。", "solution": "\n### (1) 軌跡\n\n\\(z=x+yi\\) とすると\n\\[\n|z-1|^2=(x-1)^2+y^2,\n\\]\n\\[\n|z-i|^2=x^2+(y-1)^2.\n\\]\n\n等しいので\n\\[\n(x-1)^2+y^2=x^2+(y-1)^2.\n\\]\n\n展開すると\n\\[\nx^2-2x+1+y^2=x^2+y^2-2y+1,\n\\]\nよって\n\\[\n-2x=-2y.\n\\]\n\nしたがって\n\\[\n\\boxed{x=y}.\n\\]\n\n### (2) 共有点の個数\n\n\\[\n|z|=\\sqrt2\n\\]\nより\n\\[\nx^2+y^2=2.\n\\]\n\nさらに \\(x=y\\) だから\n\\[\n2x^2=2.\n\\]\n\nよって\n\\[\nx=\\pm1.\n\\]\n\nしたがって共有点は2個。\n\n\\[\n\\boxed{2\\text{個}}\n\\]\n\n### (3) 点\n\n\\(x=y=1\\) のとき\n\\[\nz=1+i.\n\\]\n\n\\(x=y=-1\\) のとき\n\\[\nz=-1-i.\n\\]\n\nよって\n\\[\n\\boxed{z=1+i,\\ -1-i}.\n\\]\n"}, {"id": 5, "title": "確率と整数", "units": ["確率", "整数"], "difficulty": "北大やや難", "time": 25, "summary": "数字カードから2桁整数を作り、倍数条件を組み合わせて確率を求める問題。", "question": "\n\\(1,2,3,4,5,6\\) の6枚のカードから異なる2枚を順に取り出し、2桁の整数 \\(N\\) を作る。\n\n(1) \\(N\\) が3の倍数となる確率を求めよ。\n\n(2) \\(N\\) が6の倍数となる確率を求めよ。\n\n(3) \\(N\\) が6の倍数であるとき、\\(N\\) が4の倍数でもある条件付き確率を求めよ。\n", "hint": "(1) 3の倍数判定法は各桁の和。 (2) 6の倍数は2の倍数かつ3の倍数。 (3) まず6の倍数になっている数をすべて列挙する。", "solution": "\n### 全体\n\n異なる2枚を順に取り出すので、\n\\[\n6\\cdot5=30\n\\]\n通り。\n\n### (1) 3の倍数\n\n2桁の整数が3の倍数である条件は、各桁の和が3の倍数。\n\n該当するものを列挙すると\n\\[\n12,15,21,24,36,42,45,51,54,63\n\\]\nの10通り。\n\nしたがって\n\\[\n\\boxed{\\frac{10}{30}=\\frac13}.\n\\]\n\n### (2) 6の倍数\n\n6の倍数は「2の倍数かつ3の倍数」。\n\n該当するものは\n\\[\n12,24,36,42,54\n\\]\nの5通り。\n\nよって\n\\[\n\\boxed{\\frac5{30}=\\frac16}.\n\\]\n\n### (3) 条件付き確率\n\n上の5個のうち4の倍数でもあるものは\n\\[\n12,\\ 24,\\ 36\n\\]\nの3個。\n\nしたがって\n\\[\n\\boxed{\\frac35}.\n\\]\n"}, {"id": 6, "title": "微分と三角関数", "units": ["微分", "三角関数"], "difficulty": "北大標準", "time": 20, "summary": "三角関数を含む関数を微分し、増減と方程式の解の個数を調べる問題。", "question": "\n\\(0\\le x\\le\\pi\\) とし、\n\\[\nf(x)=\\sin x+x\\cos x\n\\]\nとする。\n\n(1) \\(f'(x)\\) を求めよ。\n\n(2) \\(f(x)\\) の増減を調べ、最大値・最小値を求めよ。ただし、最大値を与える \\(x\\) は方程式で表してよい。\n\n(3) 方程式\n\\[\n\\sin x+x\\cos x=0\n\\]\nの解の個数を求めよ。\n", "hint": "(2) \\(f'(x)=0\\) は \\(\\tan x=2/x\\) と変形できる。 (3) \\(f\\) の増減と端点値を利用する。", "solution": "\n### (1) 微分\n\n積の微分を使うと\n\\[\nf'(x)=\\cos x+\\cos x-x\\sin x.\n\\]\n\nしたがって\n\\[\n\\boxed{f'(x)=2\\cos x-x\\sin x}.\n\\]\n\n### (2) 増減\n\n\\(0<x<\\pi\\) で \\(f'(x)=0\\) とすると\n\\[\n2\\cos x=x\\sin x.\n\\]\n\n\\(\\cos x=0\\) はこの式を満たさないので、\n\\[\n\\tan x=\\frac2x.\n\\]\n\n\\(0<x<\\frac{\\pi}{2}\\) では、\\(\\tan x\\) は単調増加し、\\(2/x\\) は単調減少する。\nしたがってこの区間には方程式の解がただ1つ存在する。\n\nその解を \\(\\alpha\\) とする。\n数値的には\n\\[\n\\alpha\\approx1.07687.\n\\]\n\nまた、\n\\[\nf'(0)=2>0,\\qquad\nf'\\left(\\frac\\pi2\\right)=-\\frac\\pi2<0.\n\\]\nしたがって \\(f\\) は \\(0\\) から \\(\\alpha\\) まで増加し、その後 \\(\\pi\\) まで減少する。\n\n端点値は\n\\[\nf(0)=0,\\qquad\nf(\\pi)=-\\pi.\n\\]\n\nよって最小値は\n\\[\n\\boxed{-\\pi}\n\\]\nで \\(x=\\pi\\) のとき。\n\n最大値は\n\\[\n\\boxed{\\sin\\alpha+\\alpha\\cos\\alpha}\n\\]\nで、\\(\\alpha\\) は\n\\[\n\\boxed{\\tan\\alpha=\\frac2\\alpha,\\quad0<\\alpha<\\frac\\pi2}\n\\]\nを満たす唯一の数。\n\n### (3) 方程式の解\n\n方程式は\n\\[\nf(x)=0.\n\\]\n\n\\(f(0)=0\\) なので \\(x=0\\) は解。\n\n一方、\\(f\\) は \\(\\alpha\\) まで増加したあと減少し、\n\\[\nf\\left(\\frac\\pi2\\right)=1>0,\\qquad\nf(\\pi)=-\\pi<0.\n\\]\n\nしたがって \\(\\alpha\\) より後、\\(\\pi\\) より前にもう1つ解がある。\n\nよって解は\n\\[\n\\boxed{2\\text{個}}\n\\]\nである。\n"}, {"id": 7, "title": "漸化式と極限", "units": ["数列", "極限"], "difficulty": "北大標準", "time": 22, "summary": "平方根を含む漸化式について、範囲・単調性・極限を順に示す問題。", "question": "\n\\[\na_1=1,\\qquad a_{n+1}=\\sqrt{2+a_n}\n\\]\nとする。\n\n(1) \\(0<a_n<2\\) を示せ。\n\n(2) \\(a_n\\) が単調増加であることを示せ。\n\n(3)\n\\[\n\\lim_{n\\to\\infty}a_n\n\\]\nを求めよ。\n", "hint": "(1) 帰納法。 (2) \\(a_{n+1}>a_n\\) の両辺が非負であることを確認してから2乗する。", "solution": "\n### (1) \\(0<a_n<2\\)\n\nまず\n\\[\na_1=1\n\\]\nなので成立。\n\n\\(0<a_n<2\\) と仮定すると、\n\\[\n2<a_n+2<4.\n\\]\n\n平方根をとって\n\\[\n\\sqrt2<a_{n+1}<2.\n\\]\n\n特に\n\\[\n0<a_{n+1}<2.\n\\]\n\nしたがって数学的帰納法により\n\\[\n\\boxed{0<a_n<2}\n\\]\nがすべての \\(n\\) で成立する。\n\n### (2) 単調増加\n\n\\(a_{n+1}>a_n\\) を示す。\n\n両辺は正なので2乗してよく、\n\\[\n2+a_n>a_n^2\n\\]\nを示せばよい。\n\n移項すると\n\\[\na_n^2-a_n-2<0,\n\\]\nすなわち\n\\[\n(a_n-2)(a_n+1)<0.\n\\]\n\n(1)より \\(0<a_n<2\\) なので、これは確かに成立。\n\nよって\n\\[\n\\boxed{a_{n+1}>a_n}.\n\\]\n\n### (3) 極限\n\n(1),(2)より、\\(a_n\\) は上に有界な単調増加数列なので収束する。\n\nその極限を \\(L\\) とすると\n\\[\nL=\\sqrt{2+L}.\n\\]\n\n両辺を2乗して\n\\[\nL^2-L-2=0,\n\\]\n\\[\n(L-2)(L+1)=0.\n\\]\n\n(1)より \\(0<L<2\\) なので\n\\[\n\\boxed{L=2}.\n\\]\n"}, {"id": 8, "title": "ベクトルと面積", "units": ["ベクトル", "図形"], "difficulty": "北大標準", "time": 24, "summary": "線分上を動く点を媒介変数で表し、三角形の面積の最小値を求める問題。", "question": "\n\\(A=(1,0),\\ B=(0,1),\\ C=(3,2)\\) とする。\n点 \\(P\\) は線分 \\(AB\\) 上を動く。\n\n\\[\nP=(1-t,t)\\qquad(0\\le t\\le1)\n\\]\nと表す。\n\n(1) \\(\\overrightarrow{BP}\\) と \\(\\overrightarrow{BC}\\) を求めよ。\n\n(2) 三角形 \\(PBC\\) の面積を \\(t\\) の式で表せ。\n\n(3) 三角形 \\(PBC\\) の面積が最小となる \\(t\\) と、その最小値を求めよ。\n", "hint": "(2) 面積は \\(\\frac12|\\det(\\overrightarrow{BP},\\overrightarrow{BC})|\\)。 (3) 絶対値を含む一次式の最小値を考える。", "solution": "\n### (1) ベクトル\n\n\\[\nP=(1-t,t),\\quad B=(0,1),\\quad C=(3,2)\n\\]\nなので\n\\[\n\\overrightarrow{BP}\n=P-B=(1-t,t-1),\n\\]\n\\[\n\\overrightarrow{BC}\n=C-B=(3,1).\n\\]\n\nしたがって\n\\[\n\\boxed{\\overrightarrow{BP}=(1-t,t-1),\\quad\n\\overrightarrow{BC}=(3,1)}.\n\\]\n\n### (2) 面積\n\n2次元ベクトルの行列式を使うと、\n\\[\n[ PBC ]\n=\\frac12\n\\left|\n\\begin{vmatrix}\n1-t&t-1\\\\\n3&1\n\\end{vmatrix}\n\\right|.\n\\]\n\n計算すると\n\\[\n(1-t)\\cdot1-(t-1)\\cdot3\n=1-t-3t+3\n=4-4t.\n\\]\n\n\\(0\\le t\\le1\\) なので \\(4-4t\\ge0\\)。\n\nしたがって\n\\[\n\\boxed{[PBC]=2(1-t)}.\n\\]\n\n### (3) 最小値\n\n\\(0\\le t\\le1\\) なので\n\\[\n2(1-t)\n\\]\nは \\(t\\) が大きいほど小さくなる。\n\nしたがって \\(t=1\\) のとき最小。\n\nこのとき \\(P=A\\) なので、面積は\n\\[\n2(1-1)=0.\n\\]\n\nよって\n\\[\n\\boxed{t=1,\\quad\\text{最小値 }0}.\n\\]\n\n※この問題は \\(P\\) が \\(A\\) まで動けるため、最小値が0になる。今後の問題追加では、こうした「端点で自明になる」問題をできるだけ避ける。\n"}, {"id": 9, "title": "積分と指数関数", "units": ["積分", "指数・対数"], "difficulty": "北大やや難", "time": 23, "summary": "指数関数を含む積分を部分積分で処理し、極限と不等式まで考える問題。", "question": "\n\\(a>0\\) とし、\n\\[\nI(a)=\\int_0^1 xe^{ax}\\,dx\n\\]\nとする。\n\n(1) \\(I(a)\\) を求めよ。\n\n(2)\n\\[\n\\lim_{a\\to0}I(a)\n\\]\nを求めよ。\n\n(3) \\(a>0\\) のとき\n\\[\nI(a)>\\frac12\n\\]\nを示せ。\n", "hint": "(1) \\(x\\) を微分する側、\\(e^{ax}\\) を積分する側にして部分積分。 (3) \\(a>0,\\ 0<x\\le1\\) で \\(e^{ax}>1\\) を利用する。", "solution": "\n### (1) \\(I(a)\\)\n\n部分積分を使う。\n\n\\[\nu=x,\\qquad dv=e^{ax}\\,dx\n\\]\nとおくと\n\\[\ndu=dx,\\qquad\nv=\\frac1a e^{ax}.\n\\]\n\nしたがって\n\\[\nI(a)\n=\\left[\\frac{x e^{ax}}a\\right]_0^1\n-\\frac1a\\int_0^1e^{ax}\\,dx.\n\\]\n\nさらに\n\\[\n\\int_0^1e^{ax}\\,dx\n=\\left[\\frac1ae^{ax}\\right]_0^1\n=\\frac{e^a-1}{a}.\n\\]\n\nよって\n\\[\nI(a)\n=\\frac{e^a}{a}-\\frac{e^a-1}{a^2}.\n\\]\n\n整理して\n\\[\n\\boxed{\nI(a)=\\frac{e^a(a-1)+1}{a^2}\n}.\n\\]\n\n### (2) \\(a\\to0\\)\n\n積分の中身に注目すると\n\\[\nxe^{ax}\\to x\n\\]\nなので、\n\\[\n\\lim_{a\\to0}I(a)\n=\\int_0^1x\\,dx\n=\\left[\\frac{x^2}{2}\\right]_0^1\n=\\boxed{\\frac12}.\n\\]\n\n### (3) \\(I(a)>\\frac12\\)\n\n\\(a>0\\)、\\(0<x\\le1\\) なら\n\\[\nax>0\n\\]\nだから\n\\[\ne^{ax}>1.\n\\]\n\nさらに \\(x>0\\) なので\n\\[\nxe^{ax}>x.\n\\]\n\n両辺を \\(0\\le x\\le1\\) で積分すると\n\\[\nI(a)>\\int_0^1x\\,dx\n=\\frac12.\n\\]\n\nしたがって\n\\[\n\\boxed{I(a)>\\frac12}.\n\\]\n"}, {"id": 10, "title": "確率と数列", "units": ["確率", "数列"], "difficulty": "北大やや難", "time": 25, "summary": "同じ色の玉を追加する操作を繰り返し、期待値と確率の不変性を考える問題。", "question": "\n箱に赤玉1個、白玉2個が入っている。\n1個取り出して色を確認し、元に戻した後、確認した色と同じ色の玉を1個追加する操作を繰り返す。\n\n\\(n\\) 回目の操作で赤玉を引く確率を \\(p_n\\) とする。\n\n(1) \\(p_1\\) を求めよ。\n\n(2) \\(p_{n+1}\\) を \\(p_n\\) を用いて求めよ。\n\n(3) \\(\\displaystyle\\lim_{n\\to\\infty}p_n\\) を求めよ。\n", "hint": "(2) \\(n\\) 回の操作後の赤玉数を \\(R_n\\) とおき、その期待値を考える。赤を引く確率は「赤玉数÷全体の玉数」。", "solution": "\n### (1) \\(p_1\\)\n\n最初は赤1個、白2個なので、赤を引く確率は\n\\[\np_1=\\frac13.\n\\]\n\nしたがって\n\\[\n\\boxed{p_1=\\frac13}.\n\\]\n\n### (2) \\(p_{n+1}\\)\n\n\\(n\\) 回の操作が終わった直後の赤玉数を \\(R_n\\) とする。\n\n最初は赤玉が1個なので\n\\[\nR_0=1.\n\\]\n\n\\(n\\) 回後には全部で\n\\[\n3+n\n\\]\n個の玉がある。\n\nしたがって、\\(n+1\\) 回目に赤を引く確率は\n\\[\np_{n+1}\n=E\\left(\\frac{R_n}{n+3}\\right)\n=\\frac{E(R_n)}{n+3}.\n\\]\n\n一方、\\(R_n\\) の期待値を \\(r_n=E(R_n)\\) とすると、\n次の操作で赤玉が1個増える確率は\n\\[\n\\frac{R_n}{n+3}.\n\\]\n\nしたがって\n\\[\nr_{n+1}\n=r_n+\\frac{r_n}{n+3}\n=r_n\\frac{n+4}{n+3}.\n\\]\n\n\\(r_0=1\\) なので、\n\\[\nr_n\n=\\frac{n+3}{3}.\n\\]\n\nよって\n\\[\np_{n+1}\n=\\frac{r_n}{n+3}\n=\\frac13.\n\\]\n\nしたがって\n\\[\n\\boxed{p_{n+1}=\\frac13}.\n\\]\n\nつまり実は\n\\[\n\\boxed{p_n=\\frac13}\n\\]\nがすべての \\(n\\) で成立する。\n\n### (3) 極限\n\n(2)より \\(p_n\\) は常に \\(\\frac13\\)。\n\nしたがって\n\\[\n\\boxed{\\lim_{n\\to\\infty}p_n=\\frac13}.\n\\]\n"},
{"id": 11, "title": "定積分とパラメータ", "units": ["積分"], "difficulty": "北大標準", "time": 22, "summary": "パラメータを含む定積分を計算し、極限と不等式を考える。", "question": "\\(a>0\\) とし、\\(I(a)=\\displaystyle\\int_0^1\\frac{x}{1+ax}\\,dx\\) とする。\n(1) \\(I(a)\\) を求めよ。\n(2) \\(\\displaystyle\\lim_{a\\to0}I(a)\\) を求めよ。\n(3) \\(a>0\\) のとき \\(I(a)<\\frac12\\) を示せ。", "hint": "分子 \\(x\\) を \\(1+ax\\) を使って表す。", "solution": "### (1) \\(I(a)\\)\n\\[\n\\frac{x}{1+ax}=\\frac1a\\left(1-\\frac1{1+ax}\\right)\n\\]\nより\n\\[\n\\boxed{I(a)=\\frac{a-\\log(1+a)}{a^2}}.\n\\]\n\n### (2) 極限\n\\[\nI(a)=\\int_0^1\\frac{x}{1+ax}\\,dx\\to\\int_0^1x\\,dx\n=\\boxed{\\frac12}.\n\\]\n\n### (3) 不等式\n\\(a>0,\\ x>0\\) では \\(1+ax>1\\) なので\n\\[\n0<\\frac{x}{1+ax}<x.\n\\]\n積分して\n\\[\n\\boxed{I(a)<\\frac12}.\n\\]"}, {"id": 12, "title": "複素数と周期", "units": ["複素数平面", "数列"], "difficulty": "北大標準", "time": 20, "summary": "複素数の漸化式から一般項と周期を求める。", "question": "\\(z_1=1+i,\\quad z_{n+1}=iz_n\\) とする。\n(1) \\(z_n\\) を \\(n\\) を用いて表せ。\n(2) \\(\\displaystyle\\sum_{k=1}^{4}z_k\\) を求めよ。\n(3) \\(\\displaystyle\\sum_{k=1}^{n}z_k=0\\) となる最小の \\(n\\) を求めよ。", "hint": "\\(i^4=1\\) に注目する。", "solution": "### (1) 一般項\n\\[\n\\boxed{z_n=(1+i)i^{n-1}}.\n\\]\n\n### (2) 4項の和\n\\[\nz_1=1+i,\\ z_2=-1+i,\\ z_3=-1-i,\\ z_4=1-i\n\\]\nなので\n\\[\n\\boxed{\\sum_{k=1}^4z_k=0}.\n\\]\n\n### (3)\n4項ごとに和が0になり、1〜3項では0にならないので\n\\[\n\\boxed{n=4}.\n\\]"}, {"id": 13, "title": "ベクトルと最短距離", "units": ["ベクトル"], "difficulty": "北大標準", "time": 23, "summary": "線分上の点から固定点までの距離の最小値を求める。", "question": "\\(A=(0,1),B=(2,-1),C=(4,2)\\) とする。点 \\(P\\) は線分 \\(AB\\) 上を動く。\n(1) \\(P=(2t,1-2t)\\ (0\\le t\\le1)\\) と表せることを確認せよ。\n(2) \\(PC^2\\) を \\(t\\) の式で表せ。\n(3) \\(PC\\) が最小となる \\(t\\) と最小値を求めよ。", "hint": "距離そのものではなく距離の2乗を考える。", "solution": "### (1)\n\\[\nP=A+t(B-A)=\\boxed{(2t,1-2t)}.\n\\\n\n### (2)\n\\[\nPC^2=(2t-4)^2+(1-2t-2)^2\n=8t^2-12t+17.\n\\\n\n### (3)\n\\[\nPC^2=8\\left(t-\\frac34\\right)^2+\\frac{23}{2}.\n\\\n\\(t=3/4\\) は範囲内なので\n\\[\n\\boxed{t=\\frac34},\\qquad\n\\boxed{PC_{\\min}=\\sqrt{\\frac{23}{2}}}.\n"}, {"id": 14, "title": "確率と期待値", "units": ["確率"], "difficulty": "北大標準", "time": 22, "summary": "さいころの偶奇条件から条件付き期待値を求める。", "question": "1〜4の目が同様に出るさいころを2回投げ、出た目を \\(X,Y\\) とする。\n(1) \\(X+Y\\) が偶数となる確率を求めよ。\n(2) \\(X+Y\\) が偶数であるとき、\\(XY\\) の期待値を求めよ。", "hint": "条件なら2つの目の偶奇が一致する。", "solution": "### (1)\n偶奇が一致する8通り中、全体は16通りなので\n\\[\n\\boxed{\\frac12}.\n\\\n\n### (2)\n条件を満たす組は\n\\[\n(1,1),(1,3),(2,2),(2,4),(3,1),(3,3),(4,2),(4,4).\n\\\n積の合計は52だから\n\\[\n\\boxed{E(XY\\mid X+Y\\text{ が偶数})=\\frac{52}{8}=\\frac{13}{2}}.\n"}, {"id": 15, "title": "数列と定積分", "units": ["数列", "積分"], "difficulty": "北大やや難", "time": 25, "summary": "定積分で定義した数列の漸化式と極限を考える。", "question": "\\(a_n=\\displaystyle\\int_0^1\\frac{x^n}{1+x}\\,dx\\) とする。\n(1) \\(a_n+a_{n+1}\\) を求めよ。\n(2) \\(a_n=\\frac1{2(n+1)}+r_n\\) とおくとき、\\(r_n\\ge0\\) を示せ。\n(3) \\(\\displaystyle\\lim_{n\\to\\infty}na_n\\) を求めよ。", "hint": "\\(\frac1{1+x}=\frac12+\frac{1-x}{2(1+x)}\\) と変形する。", "solution": "### (1)\n\\[\na_n+a_{n+1}=\\int_0^1x^n\\,dx=\\boxed{\\frac1{n+1}}.\n\\\n\n### (2)\n\\[\n\\frac1{1+x}=\\frac12+\\frac{1-x}{2(1+x)}\n\\\nだから\n\\[\nr_n=\\frac12\\int_0^1\\frac{x^n(1-x)}{1+x}\\,dx\\ge0.\n\\\n\n### (3)\n\\[\n0\\le r_n\\le\\frac12\\int_0^1x^n(1-x)\\,dx\n=\\frac1{2(n+1)(n+2)}.\n\\\nよって\n\\[\n\\boxed{\\lim_{n\\to\\infty}na_n=\\frac12}.\n"}, {"id": 16, "title": "接線と面積", "units": ["微分", "積分"], "difficulty": "北大標準", "time": 23, "summary": "放物線の接線と面積を微分・積分で求める。", "question": "曲線 \\(y=x^2\\) 上の点 \\(P(t,t^2)\\ (t>0)\\) における接線を \\(l\\) とする。\n(1) \\(l\\) の方程式を求めよ。\n(2) \\(l\\)、\\(y=x^2\\)、\\(y\\) 軸で囲まれる面積 \\(S(t)\\) を求めよ。\n(3) \\(S(t)=4\\) となる \\(t\\) を求めよ。", "hint": "接線の傾きは \\(2t\\)。", "solution": "### (1)\n\\[\n\\boxed{y=2tx-t^2}.\n\\\n\n### (2)\n\\[\nx^2-(2tx-t^2)=(x-t)^2\n\\\nなので\n\\[\nS(t)=\\int_0^t(x-t)^2dx=\\boxed{\\frac{t^3}{3}}.\n\\\n\n### (3)\n\\[\n\\frac{t^3}{3}=4\n\\\nより\n\\[\n\\boxed{t=\\sqrt[3{12}}.\n"}, {"id": 17, "title": "最大値と微分", "units": ["微分"], "difficulty": "北大標準", "time": 22, "summary": "パラメータを含む関数の最大値を微分で求める。", "question": "\\(a>0\\) とし、\\(f(x)=xe^{-ax}\\ (x\\ge0)\\) とする。\n(1) \\(f'(x)\\) を求めよ。\n(2) \\(f(x)\\) の最大値を \\(a\\) で表せ。\n(3) その最大値が \\(1/(2e)\\) となる \\(a\\) を求めよ。", "hint": "\\(1-ax\\) の符号を調べる。", "solution": "### (1)\n\\[\n\\boxed{f'(x)=e^{-ax}(1-ax)}.\n\\\n\n### (2)\n\\(x=1/a\\) で最大だから\n\\[\n\\boxed{\\max f=\\frac1{ae}}.\n\\\n\n### (3)\n\\[\n\\frac1{ae}=\\frac1{2e}\n\\\nより\n\\[\n\\boxed{a=2}.\n"}, {"id": 18, "title": "積分漸化式", "units": ["積分", "数列"], "difficulty": "北大やや難", "time": 25, "summary": "部分積分から積分漸化式を作る。", "question": "\\(I_n=\\displaystyle\\int_0^{\\pi/2}\\sin^n x\\,dx\\ (n\\ge2)\\) とする。\n(1) \\(I_2\\) を求めよ。\n(2) \\(I_n=\\frac{n-1}{n}I_{n-2}\\) を示せ。\n(3) \\(I_4\\) を求めよ。", "hint": "部分積分で \\(\\sin^{n-1}x\\) を微分する形にする。", "solution": "### (1)\n\\[\n\\boxed{I_2=\\frac\\pi4}.\n\\\n\n### (2)\n部分積分すると\n\\[\n\\boxed{I_n=\\frac{n-1}{n}I_{n-2}}.\n\\\n\n### (3)\n\\[\nI_4=\\frac34I_2=\\boxed{\\frac{3\\pi}{16}}.\n"}, {"id": 19, "title": "極限と積分", "units": ["極限", "積分"], "difficulty": "北大やや難", "time": 24, "summary": "積分表示された数列の極限を評価する。", "question": "\\(a_n=\\displaystyle\\int_0^1\\frac{nx^n}{1+x}\\,dx\\) とする。\n\\(\\displaystyle\\lim_{n\\to\\infty}a_n\\) を求めよ。", "hint": "\\(x=1\\) の近くで \\(1/(1+x)\\) が \\(1/2\\) に近いことを使う。", "solution": "### 極限\n\\(0<c<1\\) を固定する。\\(0\\le x\\le c\\) では\n\\[\n0\\le n\\int_0^c\\frac{x^n}{1+x}dx\\le n\\int_0^c x^n dx\\to0.\n\\\n一方 \\(c\\le x\\le1\\) では \\(1/(1+x)\\) は \\(1/2\\) に一様に近づくよう \\(c\\) を1に近づけられる。さらに\n\\[\nn\\int_0^1x^n dx=\\frac{n}{n+1}\\to1.\n\\\nしたがって\n\\[\n\\boxed{\\lim_{n\\to\\infty}a_n=\\frac12}.\n"}, {"id": 20, "title": "三角関数と微分", "units": ["三角関数", "微分"], "difficulty": "北大標準", "time": 20, "summary": "三角関数を含む関数の極値を調べる。", "question": "\\(0\\le x\\le\\pi\\) で \\(f(x)=x\\sin x\\) とする。\n(1) \\(f'(x)\\) を求めよ。\n(2) \\(f(x)\\) の最大値を表せ。", "hint": "\\(f'(x)=0\\) を \\(\tan x=-x\\) に変形する。", "solution": "### (1)\n\\[\n\\boxed{f'(x)=\\sin x+x\\cos x}.\n\\]\n\n### (2)\n\\((0,\\pi/2)\\) では \\(f'(x)>0\\)。\\((\\pi/2,\\pi)\\) では \\(f'(x)=0\\) は \\(\\tan x=-x\\) で、解はただ1つ。これを \\(\\alpha\\) とすると\n\\[\n\\frac\\pi2<\\alpha<\\pi,\\qquad\n\\boxed{\\max f=\\alpha\\sin\\alpha}.\n\\]"}, {"id": 21, "title": "漸化式と和", "units": ["数列"], "difficulty": "北大標準", "time": 20, "summary": "一次漸化式から一般項と和を求める。", "question": "\\(a_1=2,\\ a_{n+1}=3a_n-2\\) とする。\n(1) \\(a_n\\) を求めよ。\n(2) \\(\\displaystyle\\sum_{k=1}^na_k\\) を求めよ。", "hint": "\\(a_n-1\\) を考える。", "solution": "### (1)\n\\[\na_{n+1}-1=3(a_n-1)\n\\\nより\n\\[\n\\boxed{a_n=3^{n-1}+1}.\n\\\n\n### (2)\n\\[\n\\boxed{\\sum_{k=1}^na_k=\\frac{3^n-1}{2}+n}.\n"}, {"id": 22, "title": "確率と漸化式", "units": ["確率", "数列"], "difficulty": "北大やや難", "time": 24, "summary": "玉の増減を期待値で追い、確率の不変性を示す。", "question": "最初に白玉1個、黒玉1個がある。1個を無作為に取り出して戻した後、反対の色の玉を1個追加する。\\(n\\) 回後に白玉を引く確率を \\(p_n\\) とする。\n(1) \\(p_1\\) を求めよ。\n(2) \\(p_n=\\frac12\\) がすべての \\(n\\) で成り立つことを示せ。", "hint": "白玉数の期待値を考えると、毎回白玉を引く確率は期待白玉数÷総数になる。", "solution": "### (1)\n\\[\n\\boxed{p_1=\\frac12}.\n\\]\n\n### (2)\n\\(n\\) 回後の白玉数を \\(R_n\\) とする。総数は \\(n+2\\) 個。\n白を引くと白玉数は変わらず、黒を引くと白玉が1個増えるので\n\\[\nE(R_{n+1})=E(R_n)+1-p_{n+1}.\n\\]\nまた\n\\[\np_{n+1}=\\frac{E(R_n)}{n+2}.\n\\]\n\\(E(R_n)=(n+2)/2\\) を帰納法で示せば\n\\[\n\\boxed{p_n=\\frac12}.\n\\]"}, {"id": 23, "title": "ベクトルと球", "units": ["ベクトル"], "difficulty": "北大やや難", "time": 24, "summary": "空間ベクトルと距離条件から平面と球の交線を考える。", "question": "\\(A=(1,0,0),B=(0,1,0)\\) とし、\\(P=(x,y,z)\\) が \\(|P-A|=|P-B|\\) を満たす。\n(1) \\(x,y,z\\) の方程式を求めよ。\n(2) さらに \\(|P|=1\\) のとき、点 \\(P\\) の集合を説明せよ。", "hint": "距離の2乗を比較する。", "solution": "### (1)\n\\[\n(x-1)^2+y^2+z^2=x^2+(y-1)^2+z^2\n\\\nより\n\\[\n\\boxed{x=y}.\n\\\n\n### (2)\n\\[\nx=y,\\quad x^2+y^2+z^2=1\n\\\nなので\n\\[\n2x^2+z^2=1.\n\\\nしたがって\n\\[\n\\boxed{\\text{単位球面と平面 }x=y\\text{ の交線である円}}.\n"}, {"id": 24, "title": "複素数の軌跡", "units": ["複素数平面"], "difficulty": "北大標準", "time": 22, "summary": "絶対値条件から複素数平面上の軌跡を求める。", "question": "\\(|z-2|=|z+2|\\) を満たす複素数 \\(z=x+yi\\) の軌跡を求めよ。\nさらに \\(|z|=3\\) との交点を求めよ。", "hint": "絶対値を2乗する。", "solution": "### 軌跡\n\\[\n(x-2)^2+y^2=(x+2)^2+y^2\n\\\nより\n\\[\n\\boxed{x=0}.\n\\\nさらに \\(x^2+y^2=9\\) より\n\\[\n\\boxed{z=3i,\\ -3i}.\n"}, {"id": 25, "title": "整数と最大公約数", "units": ["整数"], "difficulty": "北大標準", "time": 21, "summary": "約数条件と最大公約数を組み合わせる。", "question": "\\(n\\) は \\(60\\) の正の約数とする。\n\\(\\gcd(n,30)=5\\) となる \\(n\\) をすべて求めよ。", "hint": "\\(60=2^2\\cdot3\\cdot5\\) と素因数分解する。", "solution": "### 解答\n\\(\\gcd(n,30)=5\\) なので、\\(n\\) は5を含み、2または3を因子として含むことはできない。\n\\(60\\) の約数でこれを満たすのは\n\\[\n\\boxed{n=5}.\n"}, {"id": 26, "title": "指数関数と面積", "units": ["指数・対数", "積分"], "difficulty": "北大標準", "time": 23, "summary": "指数関数と直線で囲まれる面積を求める。", "question": "\\(0\\le x\\le1\\) で \\(y=e^x\\) と \\(y=1+x\\) を考える。\n(1) \\(e^x\\ge1+x\\) を示せ。\n(2) 2曲線と \\(x=0,1\\) で囲まれる面積を求めよ。", "hint": "\\(g(x)=e^x-1-x\\) を微分する。", "solution": "### (1)\n\\[\ng'(x)=e^x-1\\ge0,\\quad g(0)=0\n\\\nより\n\\[\n\\boxed{e^x\\ge1+x}.\n\\\n\n### (2)\n\\[\n\\int_0^1(e^x-1-x)dx\n=\\boxed{e-\\frac52}.\n"}, {"id": 27, "title": "二次関数と接線", "units": ["微分", "図形と方程式"], "difficulty": "北大標準", "time": 21, "summary": "接線条件から二次関数の係数を決定する。", "question": "\\(y=x^2+ax\\) の \\(x=1\\) における接線が \\(y=3x-1\\) である。\n(1) \\(a\\) を求めよ。\n(2) 曲線と接線の交点を求めよ。", "hint": "点の一致と接線の傾きの一致を使う。", "solution": "### (1)\n曲線の傾きは \\(2x+a\\) だから \\(x=1\\) で \\(2+a=3\\)。\n\\[\n\\boxed{a=1}.\n\\\n\n### (2)\n\\[\nx^2+x=3x-1\n\\\nより\n\\[\n(x-1)^2=0.\n\\\nしたがって\n\\[\n\\boxed{(1,2)}.\n"}, {"id": 28, "title": "確率と場合の数", "units": ["確率"], "difficulty": "北大標準", "time": 20, "summary": "カードの並べ方と倍数条件を組み合わせる。", "question": "\\(1,2,3,4,5\\) から異なる3枚を選び、並べて3桁の整数を作る。\n(1) 全体の個数を求めよ。\n(2) 5の倍数となる確率を求めよ。\n(3) 3の倍数となる確率を求めよ。", "hint": "(2) 一の位が5。(3) 3枚の数字の和が3の倍数。", "solution": "### (1)\n\\[\n\\boxed{60}.\n\\\n\n### (2)\n一の位が5なら残りは \\(4\\cdot3=12\\) 通り。\n\\[\n\\boxed{\\frac15}.\n\\\n\n### (3)\n3の倍数になる3枚の組は\n\\[\n\\{1,2,3\\},\\{1,3,5\\},\\{2,3,4\\},\\{3,4,5\\}\n\\\nの4組。各6通りなので24通り。\n\\[\n\\boxed{\\frac25}.\n"}, {"id": 29, "title": "漸化式と極限", "units": ["数列", "極限"], "difficulty": "北大標準", "time": 22, "summary": "一次漸化式から一般項と極限を求める。", "question": "\\(a_1=0,\\quad a_{n+1}=\\frac{a_n+2}{3}\\) とする。\n(1) \\(a_n\\) の一般項を求めよ。\n(2) \\(\\lim a_n\\) を求めよ。", "hint": "定常値1を引く。", "solution": "### (1)\n\\[\na_{n+1}-1=\\frac13(a_n-1)\n\\\nより\n\\[\n\\boxed{a_n=1-\\left(\\frac13\\right)^{n-1}}.\n\\\n\n### (2)\n\\[\n\\boxed{\\lim_{n\\to\\infty}a_n=1}.\n"}, {"id": 30, "title": "面積とパラメータ", "units": ["積分"], "difficulty": "北大やや難", "time": 22, "summary": "パラメータで変化する放物線と直線の面積を求める。", "question": "\\(a>0\\) とし、\\(y=x^2\\) と \\(y=ax\\) で囲まれる面積を \\(S(a)\\) とする。\n(1) \\(S(a)\\) を求めよ。\n(2) \\(S(a)=9\\) となる \\(a\\) を求めよ。", "hint": "交点は \\(x=0,a\\)。", "solution": "### (1)\n\\[\nS(a)=\\int_0^a(ax-x^2)dx=\\boxed{\\frac{a^3}{6}}.\n\\\n\n### (2)\n\\[\na^3=54\n\\\nより\n\\[\n\\boxed{a=\\sqrt[3{54}}.\n"}, {"id": 31, "title": "複素数と方程式", "units": ["複素数平面", "方程式"], "difficulty": "北大標準", "time": 23, "summary": "複素数方程式を実部・虚部に分けて解く。", "question": "\\(z=x+yi\\) が \\(z^2=2i\\) を満たすとする。\n(1) \\(x,y\\) の連立方程式を求めよ。\n(2) \\(z\\) をすべて求めよ。", "hint": "\\(z^2=(x^2-y^2)+2xyi\\)。", "solution": "### (1)\n\\[\n\\boxed{x^2-y^2=0,\\quad xy=1}.\n\\\n\n### (2)\n\\(x=y\\) だから \\(x^2=1\\)。よって\n\\[\n\\boxed{z=1+i,\\ -1-i}.\n"}, {"id": 32, "title": "ベクトルと体積", "units": ["ベクトル"], "difficulty": "北大やや難", "time": 25, "summary": "空間ベクトルから四面体の体積を求める。", "question": "\\(O=(0,0,0), A=(1,0,0), B=(0,2,0), C=(0,0,3)\\) とする。\n(1) 3つのベクトルは互いに垂直であることを確認せよ。\n(2) 四面体 \\(OABC\\) の体積を求めよ。", "hint": "平行六面体の体積は \\(1\\cdot2\\cdot3\\)。", "solution": "### (1)\n各ベクトルは異なる座標軸方向なので、内積はすべて0。\n\n### (2)\n平行六面体の体積は6。四面体はその \\(1/6\\) なので\n\\[\n\\boxed{1}.\n"}, {"id": 33, "title": "確率と期待値", "units": ["確率"], "difficulty": "北大やや難", "time": 22, "summary": "さいころの条件付き期待値を求める。", "question": "1〜6のさいころを2回投げ、和を \\(X\\) とする。\n(1) \\(E(X)\\) を求めよ。\n(2) \\(X\\ge10\\) であるときの \\(E(X)\\) を求めよ。", "hint": "(2) 条件を満たす6通りを列挙する。", "solution": "### (1)\n1回の期待値は \\(7/2\\) なので\n\\[\n\\boxed{E(X)=7}.\n\\\n\n### (2)\n該当する和は \\(10,10,11,10,11,12\\) で合計64。\n6通りなので\n\\[\n\\boxed{\\frac{32}{3}}.\n"}, {"id": 34, "title": "微分と不等式", "units": ["微分"], "difficulty": "北大標準", "time": 21, "summary": "微分を利用して対数の基本不等式を示す。", "question": "\\(x>0\\) に対して \\(\\log x\\le x-1\\) を示せ。", "hint": "\\(f(x)=x-1-\\log x\\) を考える。", "solution": "### 証明\n\\[\nf'(x)=1-\\frac1x=\\frac{x-1}{x}.\n\\\nよって \\(f\\) は \\(x=1\\) で最小となり、\\(f(1)=0\\)。\nしたがって\n\\[\n\\boxed{\\log x\\le x-1}.\n"}, {"id": 35, "title": "定積分と対数", "units": ["積分", "指数・対数"], "difficulty": "北大標準", "time": 20, "summary": "対数関数の定積分を計算する。", "question": "\\(I=\\displaystyle\\int_1^e\\log x\\,dx\\) とする。\\(I\\) を求めよ。", "hint": "\\(\\int\\log x\\,dx=x\\log x-x\\)。", "solution": "### 計算\n\\[\nI=[x\\log x-x_1^e\n=(e-e)-(0-1)\n=\\boxed1.\n"}, {"id": 36, "title": "数列と無限級数", "units": ["数列"], "difficulty": "北大標準", "time": 21, "summary": "無限等比級数と重み付き和を求める。", "question": "\\(a_n=\\left(\\frac23\\right)^n\\) とする。\n(1) \\(\\sum_{n=1}^\\infty a_n\\) を求めよ。\n(2) \\(\\sum_{n=1}^\\infty n a_n\\) を求めよ。", "hint": "\\(\\sum nr^n=\frac{r}{(1-r)^2}\\) を利用する。", "solution": "### (1)\n\\[\n\\boxed{2}.\n\\\n\n### (2)\n\\[\n\\sum_{n=1}^\\infty nr^n=\\frac{r}{(1-r)^2}\n\\\nに \\(r=2/3\\) を代入して\n\\[\n\\boxed{6}.\n"}, {"id": 37, "title": "確率と整数", "units": ["確率", "整数"], "difficulty": "北大標準", "time": 23, "summary": "整数の倍数条件を使って確率を求める。", "question": "1,2,\\dots,10から異なる2個を選ぶ。\n(1) 積が偶数となる確率を求めよ。\n(2) 積が6の倍数となる確率を求めよ。", "hint": "(1) 両方奇数を除く。(2) 3の倍数を含み、かつ偶数を含む組を数える。", "solution": "### (1)\n全体は \\(\\binom{10}{2}=45\\)。両方奇数は \\(\\binom52=10\\)。\n\\[\n\\boxed{\\frac79}.\n\\\n\n### (2)\n3の倍数を含む組のうち、積が偶数になるものを数える。\n\\(3,9\\) と偶数 \\(2,4,6,8,10\\) の組は \\(2\\cdot5=10\\) 通り。\n6を含む組は9通りだが、\\((6,3),(6,9)\\) は前に含まれるので2通り重複。\nしたがって \\(10+9-2=17\\) 通り。\n\\[\n\\boxed{\\frac{17}{45}}.\n"}, {"id": 38, "title": "図形と方程式", "units": ["図形と方程式"], "difficulty": "北大標準", "time": 21, "summary": "円と直線の共有点を判別式で調べる。", "question": "円 \\(x^2+y^2=5\\) と直線 \\(y=mx+1\\) が接する実数 \\(m\\) は存在するか。", "hint": "中心から直線までの距離と半径を比較する。", "solution": "### 解答\n中心 \\((0,0)\\) から直線 \\(mx-y+1=0\\) までの距離は\n\\[\n\\frac1{\\sqrt{m^2+1}}\\le1.\n\\\n半径は \\(\\sqrt5>1\\) なので、直線は常に円の内部を通る。\nしたがって\n\\[\n\\boxed{\\text{接する実数 }m\\text{ は存在しない}}.\n"}, {"id": 39, "title": "極限と数列", "units": ["極限", "数列"], "difficulty": "北大やや難", "time": 21, "summary": "有理化によって数列の極限を求める。", "question": "\\(a_n=n(\\sqrt{n^2+1}-n)\\) とする。\\(\\lim_{n\\to\\infty}a_n\\) を求めよ。", "hint": "分子を有理化する。", "solution": "### 解答\n\\[\na_n=n\\frac1{\\sqrt{n^2+1}+n}\n=\\frac1{\\sqrt{1+\\frac1{n^2}}+1}.\n\\\nよって\n\\[\n\\boxed{\\lim_{n\\to\\infty}a_n=\\frac12}.\n"}, {"id": 40, "title": "微積融合・最小値", "units": ["微分", "積分"], "difficulty": "北大やや難", "time": 25, "summary": "積分で定義された関数を微分し、最小値を求める。", "question": "\\(F(x)=\\displaystyle\\int_0^x(t^2-2t)\\,dt\\quad(0\\le x\\le3)\\) とする。\n(1) \\(F'(x)\\) を求めよ。\n(2) \\(F(x)\\) の最小値を求めよ。", "hint": "微積分の基本定理で \\(F'(x)\\) を求める。", "solution": "### (1)\n\\[\n\\boxed{F'(x)=x^2-2x=x(x-2)}.\n\\\n\n### (2)\n\\(0<x<2\\) で減少、\\(2<x<3\\) で増加するので \\(x=2\\) で最小。\n\\[\nF(2)=\\int_0^2(t^2-2t)dt\n=\\boxed{-\\frac43}.\n"}];
let current = null;
let hintVisible = false;
let reviewIds = loadReviewIds();
function formatQuestion(text){
  return text
    .replace(/\n\s*(?=\(\d+\))/g, '<br><br>')
    .replace(/\n{3,}/g, '\n\n');
}
function formatSolution(text){
  return text
    .replace(/^###\s*(.+)$/gm, '<h3>$1</h3>')
    .replace(/\n{3,}/g, '\n\n');
}


function loadReviewIds(){
  try { return JSON.parse(localStorage.getItem('hokudaiMathReview') || '[]'); }
  catch(e){ return []; }
}
function saveReviewIds(){
  localStorage.setItem('hokudaiMathReview', JSON.stringify([...new Set(reviewIds)]));
}
function addReview(id=current?.id){
  if(!id) return;
  if(!reviewIds.includes(id)) reviewIds.push(id);
  saveReviewIds();
  updateHomeStatus();
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer=setTimeout(()=>t.classList.remove('show'),1800);
}
function setNav(which){
  document.getElementById('navHome').classList.toggle('active',which==='home');
  document.getElementById('navReview').classList.toggle('active',which==='review');
}
function showScreen(id, nav='home'){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  setNav(nav);
  window.scrollTo({top:0,behavior:'instant'});
}
function goHome(){
  updateHomeStatus();
  showScreen('home','home');
}
function updateHomeStatus(){
  const el=document.getElementById('homeStatus');
  const n=reviewIds.length;
  el.textContent=`全${problems.length}問 / 復習中：${n}題`;
}

const selectedUnits = new Set();
function allUnits(){
  const s = new Set();
  problems.forEach(p => p.units.forEach(u => s.add(u)));
  return [...s];
}
function showUnitSelect(){
  renderUnitChoices();
  showScreen('units','home');
}
function renderUnitChoices(){
  const box=document.getElementById('unitChoices');
  box.innerHTML=allUnits().map(u=>{
    const sel=selectedUnits.has(u);
    return `<button class="unit-choice ${sel?'selected':''}" onclick="toggleUnit('${u.replace(/'/g,"\\'")}')">${sel?'✓ ':''}${u}</button>`;
  }).join('');
  document.getElementById('unitStatus').textContent=`${selectedUnits.size} / 2 単元を選択中`;
}
function toggleUnit(unit){
  if(selectedUnits.has(unit)) selectedUnits.delete(unit);
  else if(selectedUnits.size<2) selectedUnits.add(unit);
  else { showToast('単元は2つまで選べます'); return; }
  renderUnitChoices();
}
function startSelectedUnits(){
  if(selectedUnits.size===0){ showToast('単元を1つ以上選んでください'); return; }
  const pool=problems.filter(p=>p.units.some(u=>selectedUnits.has(u)));
  if(!pool.length){ showToast('この範囲の問題はありません'); return; }
  current=pool.length===1 ? pool[0] : pool[Math.floor(Math.random()*pool.length)];
  renderProblem();
  showScreen('problem','home');
}

function randomProblem(){
  if(problems.length===1) return problems[0];
  let p;
  do { p=problems[Math.floor(Math.random()*problems.length)]; }
  while(current && p.id===current.id);
  return p;
}
function startRandom(){
  current=randomProblem();
  renderProblem();
  showScreen('problem','home');
}
function startProblemById(id){
  current=problems.find(p=>p.id===id) || null;
  if(!current) return;
  renderProblem();
  showScreen('problem','home');
}
function renderProblem(){
  hintVisible=false;
  document.getElementById('hintBox').classList.remove('show');
  document.getElementById('hintBox').innerHTML='';
  document.getElementById('problemTitle').textContent=`No.${current.id} ${current.title}`;
  document.getElementById('problemMeta').innerHTML=
    current.units.map(x=>`<span class="tag">${x}</span>`).join('')+
    `<span class="tag">${current.difficulty}</span><span class="tag">想定 ${current.time}分</span>`;
  document.getElementById('problemQuestion').innerHTML=formatQuestion(current.question);
  if(window.MathJax) MathJax.typesetPromise([document.getElementById('problemQuestion')]).catch(()=>{});
}
function toggleHint(){
  const box=document.getElementById('hintBox');
  hintVisible=!hintVisible;
  if(hintVisible){
    box.innerHTML=`<strong>ヒント</strong><br>${current.hint}`;
    box.classList.add('show');
    if(window.MathJax) MathJax.typesetPromise([box]).catch(()=>{});
  }else box.classList.remove('show');
}
function showAnswer(){
  document.getElementById('answerQuestion').innerHTML=formatQuestion(current.question);
  document.getElementById('solution').innerHTML=formatSolution(current.solution);
  document.getElementById('resultStatus').innerHTML='';
  showScreen('answer','home');
  if(window.MathJax) MathJax.typesetPromise([
    document.getElementById('answerQuestion'),
    document.getElementById('solution')
  ]).catch(()=>{});
}
function backToProblem(){ showScreen('problem','home'); }
function markCorrect(){
  reviewIds=reviewIds.filter(id=>id!==current.id);
  saveReviewIds();
  document.getElementById('resultStatus').innerHTML='<div class="status">正解として記録しました。復習リストからは外しました。</div>';
}
function markWrong(){
  addReview();
  document.getElementById('resultStatus').innerHTML='<div class="status">不正解として記録しました。この問題を復習に追加しました。</div>';
  showToast('復習に追加しました');
}
function renderReview(){
  const list=document.getElementById('reviewList');
  if(reviewIds.length===0){
    list.innerHTML='<div class="empty">まだ復習に入った問題はありません。<br>解答画面で「不正解」または「復習」を押すと、ここに表示されます。</div>';
    return;
  }
  const items=reviewIds.map(id=>problems.find(p=>p.id===id)).filter(Boolean);
  list.innerHTML=items.map(p=>`
    <button class="review-item" onclick="startProblemById(${p.id})">
      <div class="review-no">No.${p.id}</div>
      <div class="review-title">${p.title}</div>
      <div class="review-meta">${p.units.join(' ・ ')}</div>
      <div class="review-summary">${p.summary}</div>
    </button>
  `).join('');
}
function showReview(){
  renderReview();
  showScreen('review','review');
}
updateHomeStatus();
</script>
</body>
</html>
